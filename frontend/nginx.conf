limit_req_zone $binary_remote_addr zone=login:10m rate=120r/m;
limit_req_zone $binary_remote_addr zone=submit:10m rate=120r/m;
limit_conn_zone $binary_remote_addr zone=connections:10m;

server {
    listen 80;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 9m;
    client_body_timeout 15s;
    limit_conn connections 200;
    limit_req_status 429;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    location = /api/auth/login {
        limit_req zone=login burst=100 nodelay;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }
    location = /api/submissions {
        limit_req zone=submit burst=100 nodelay;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }
    location /api/ {
        access_log off;
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 65s;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
